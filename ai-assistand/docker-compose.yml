services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: personal_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    volumes:
      - personal_assistant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: src/PersonalAssistant.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=personal_assistant;Username=postgres;Password=123456
      DeepSeek__BaseUrl: ${DeepSeek__BaseUrl:-https://api.deepseek.com}
      DeepSeek__Model: ${DeepSeek__Model:-deepseek-chat}
      DeepSeek__ApiKey: ${DeepSeek__ApiKey:-}
      FishAudio__BaseUrl: ${FishAudio__BaseUrl:-https://api.fish.audio}
      FishAudio__ApiKey: ${FishAudio__ApiKey:-}
      FishAudio__VoiceId: ${FishAudio__VoiceId:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web/personal-assistant-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  personal_assistant_postgres:
